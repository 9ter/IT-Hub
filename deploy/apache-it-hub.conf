# IT Hub — Include ใน <VirtualHost *:8443> และ <VirtualHost *:8445> ของ web-erp-ssl.conf
#   Include /var/www/IT-Hub/deploy/apache-it-hub.conf
# วางก่อน DocumentRoot /var/www/web-erp/public (ถ้า vhost ยังใช้ ProxyPass / ให้วางก่อนบรรทัดนั้น)
# ไม่แตะ path อื่นของ ERP — ใช้เฉพาะ /it-hub

ProxyPass        /it-hub !
RedirectMatch 302 ^/it-hub$ /it-hub/

# API (PHP) — ต้องประกาศก่อน Alias /it-hub
# รันผ่าน PHP-FPM pool "www" แยกจาก pool erp-production ของ ERP
Alias /it-hub/api /var/www/IT-Hub/api/public
<Directory /var/www/IT-Hub/api/public>
    Require all granted
    AllowOverride None
    Options -Indexes
    FallbackResource /it-hub/api/index.php
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.5-fpm.sock|fcgi://localhost"
    </FilesMatch>
    <Files ".user.ini">
        Require all denied
    </Files>
</Directory>

# หน้าเว็บ Vue (ไฟล์ที่ build แล้ว)
Alias /it-hub /var/www/IT-Hub/web/dist
<Directory /var/www/IT-Hub/web/dist>
    Require all granted
    AllowOverride None
    Options -Indexes
    FallbackResource /it-hub/index.html
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>
</Directory>
<Directory /var/www/IT-Hub/web/dist/assets>
    Header set Cache-Control "public, max-age=31536000, immutable"
</Directory>
